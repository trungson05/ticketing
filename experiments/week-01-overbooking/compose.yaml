
services:
  postgres:
    image: postgres:16
    container_name: datn-week1-postgres
    environment:
      POSTGRES_DB: week1db
      POSTGRES_USER: week1
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - week1_pgdata:/var/lib/postgresql/data

volumes:
  week1_pgdata:
